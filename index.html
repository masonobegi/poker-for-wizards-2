<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#05060c" />
    <meta name="color-scheme" content="dark" />
    <title>HEXHOLD — Impossible Poker</title>
    <meta name="description" content="Online multiplayer Texas Hold'em where the deck breaks the laws of physics. Cards in superposition, per-player truth, timeline rewinds, counterspells." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Shown until React mounts, so the first paint is never a white flash. */
      html, body, #root { height: 100%; margin: 0; background: #05060c; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: radial-gradient(ellipse at 50% 40%, #131a33 0%, #05060c 70%);
        color: #f0c465; font-family: 'Cinzel', Georgia, serif; letter-spacing: .3em;
        font-size: 13px; z-index: 9999; transition: opacity .5s ease;
      }
      #boot .mark { display: grid; place-items: center; gap: 22px; }
      #boot .ring {
        width: 64px; height: 64px; border-radius: 50%;
        border: 1px solid rgba(240,196,101,.25); border-top-color: #f0c465;
        animation: bootspin 1.4s cubic-bezier(.5,0,.5,1) infinite;
      }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="mark"><div class="ring"></div><div>HEXHOLD</div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
