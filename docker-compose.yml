# A complete public HEXHOLD server.
#
#   docker compose up -d --build
#
# Then point a desktop build at it: Settings → Online → Server, or set
# HEXHOLD_SERVER at build time.
services:
  hexhold:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Browsers connecting from another origin must be listed here. A desktop
      # build sends no Origin and is always allowed.
      ALLOWED_ORIGINS: "${HEXHOLD_ORIGINS:-}"
      MAX_ROOMS: "500"
      MAX_SOCKETS_PER_IP: "12"
      ROOMS_PER_IP_PER_HOUR: "40"
      MESSAGES_PER_SECOND: "25"
      IDLE_ROOM_MINUTES: "45"
      PERSIST: "true"
      PERSIST_FILE: "/data/hexhold.db"
    volumes:
      - hexhold-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  hexhold-data:
